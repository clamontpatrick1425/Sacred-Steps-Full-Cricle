    <script>
      (function() {
        // Fix for "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _activeFetch = _origFetch;
          var desc = {
            get: function() { return _activeFetch; },
            set: function(fn) { _activeFetch = fn; },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(window, 'fetch', desc);
          } catch (e1) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            }
          } catch (e2) {}
          try {
            if (typeof globalThis !== 'undefined' && globalThis !== window) {
              Object.defineProperty(globalThis, 'fetch', desc);
            }
          } catch (e3) {}
        } catch (err) {}

        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.includes('fetch') && e.message.includes('getter')) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
